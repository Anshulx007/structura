[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "structura"
version = "0.1.0"
description = "2D structural analysis and drawing application (truss / beam / frame)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6", "matplotlib>=3.8"]
report = ["reportlab>=4.0", "matplotlib>=3.8"]
dev = ["pytest>=8.0", "pytest-qt>=4.4", "hypothesis>=6.100", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
structura = "structura.core.cli:main"

[tool.setuptools.packages.find]
include = ["structura*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "gui: requires PySide6 (skipped when not installed)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["N806"]  # allow K, T, ... matrix names in numerical code

[tool.mypy]
python_version = "3.11"
files = ["structura/core"]
strict = true
warn_unreachable = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
# SciPy ships no py.typed marker; its linalg routines are used through thin wrappers only.
module = ["scipy.*"]
ignore_missing_imports = true
